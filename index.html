<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1456A0" />
  <meta name="description" content="Your personal insurance client portal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="InsurePortal" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>InsurePortal</title>
</head>

<body>
  <div id="root">
    <div style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #F7F6F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    ">
      <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 28px;">
        <div style="
          position: absolute;
          width: 82px;
          height: 82px;
          border-radius: 22px;
          background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
          opacity: 0.35;
          filter: blur(10px);
          animation: pulseGlow 2s infinite ease-in-out;
        "></div>
        <div style="
          width: 72px;
          height: 72px;
          border-radius: 18px;
          background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #ffffff;
          font-weight: 800;
          font-size: 26px;
          letter-spacing: -0.04em;
          box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
          z-index: 1;
          animation: pulseLogo 2s infinite ease-in-out;
        ">
          IP
        </div>
      </div>
      <div style="
        width: 26px;
        height: 26px;
        border: 2.5px solid rgba(20, 86, 160, 0.1);
        border-top-color: #1456A0;
        border-radius: 50%;
        animation: spin 0.8s infinite linear;
      "></div>
      
      <style>
        @keyframes pulseGlow {
          0%, 100% { transform: scale(0.9); opacity: 0.25; }
          50% { transform: scale(1.15); opacity: 0.5; }
        }
        @keyframes pulseLogo {
          0%, 100% { transform: scale(0.97); }
          50% { transform: scale(1.03); }
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
